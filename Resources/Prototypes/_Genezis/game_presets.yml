- type: gamePreset
  id: GenezisSecret
  alias:
    - secret genezis
    - Основа генезиса
  name: Основа генезиса
  description: Основной пресет, выполните приказ от совета Триглава и попытайтесь выжить.
  showInVote: true
  # isMiniGame: true  
  minPlayers: 20
  # maxPlayers: 80
  rules:
    - WageScheduler
    - CMDistressSignal
    - CombatDynamic
    - CalmDynamic
    - Traitor    
  # supportedMaps: GenezisDefaultMapPool
  # forceMap: true

- type: gamePreset
  id: GenezisShipwrecked
  alias:
    - GenezisShipwrecked
    - Падение генезис
  name: Неудачная операция
  description: Дополнительный пресет, ваш шаттл был подбит и теперь вы терпете крушение на поверхности планеты.
  showInVote: true
  # isMiniGame: true
  minPlayers: 1
  maxPlayers: 20
  rules:
    - Shipwrecked
  supportedMaps: GenezisShipwreckedPool
  # forceMap: true 


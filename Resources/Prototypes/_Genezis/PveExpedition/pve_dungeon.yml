- type: dungeonConfig
  id: PveDungeonMines
  data:
    entities:
      Cabling: Catwalk
    spawnGroups:
      CornerClutter: MineshaftClutter
      Entrance: BaseWoodWall
      EntranceFlank: BaseWoodWall
      Junction: BaseWoodSupport
      Window: BaseWoodWall
    tiles:
      FallbackTile: FloorCaveDrought
    whitelists:
      Rooms:
        tags:
        - Mineshaft
  layers:
  - !type:PrototypeDunGen
    proto: PveDungeonBase

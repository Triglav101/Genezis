# Список враждебных групп, которые спавнятся по всей планете вокруг игроков.
# unlockAfter - через сколько секунд после посадки группа становится доступной.
# Частота волн растёт сама (интервал падает от hostileStartInterval до hostileMinInterval, см. PveExpedition).
# Размер группы - случайно между minCount и maxCount.

# ---------- Доступны сразу после посадки ----------
- type: pveHostileGroup
  id: PveHostileMobPlasmaCorpse
  entity: MobPlasmaCorpse
  minCount: 17
  maxCount: 32
  unlockAfter: 0
  weight: 3

- type: pveHostileGroup
  id: PveHostileMobParasite

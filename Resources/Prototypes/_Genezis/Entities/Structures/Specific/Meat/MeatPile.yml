- type: entity
  id: MeatPile
  parent: BaseStructure
  name: Столб скорби
  description: Алтарь созданный из черепов различных рас, по звукам в нём чье-то гнездо.
  components:
    - type: MeleeSound
      soundGroups:
        Brute:
          path:
            "/Audio/Genezis/Misc/meathit.ogg"
    - type: Sprite
      noRot: true
      sprite: Genezis/Structures/Meat/MeatPile.rsi
      layers:
        - state: MeatPile
    - type: Icon
      sprite: Genezis/Structures/Meat/MeatPile.rsi
      state: MeatPile
    - type: Physics
      bodyType: Static
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeAabb
            bounds: "-0.3,-0.3,0.3,0.3"
          density: 50
          mask:
            - MachineMask
          layer:
            - MachineLayer
    - type: Timer
    - type: TimedSpawner
      prototypes:
        - MobParasite
      chance: 0.50
      intervalSeconds: 60
      minimumEntitiesSpawned: 1
      maximumEntitiesSpawned: 2
    - type: AmbientSound
      volume: -3
      range: 5
      sound:
        path: /Audio/Genezis/AmbientSound/HiveSound.ogg            
    - type: Damageable
      damageContainer: Inorganic
      damageModifierSet: Metallic
    - type: Destructible
      thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 170
        behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - type: Appearance


# Handheld Mech Analyzer

- type: entity
  id: BaseHandheldMechAnalyzer
  parent: BaseItem
  name: mech analyzer
  description: A hand-held mech scaner.
  abstract: true
  components:
  - type: Sprite
    sprite: Objects/Specific/Mech/mecha_equipment.rsi
    state: mecha_analyzer
    layers:
    - state: mecha_analyzer
    - state: mecha_analyzer_anim
      shader: unshaded
      visible: true
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
  - type: Item
    storedRotation: -90
  - type: ActivatableUI
    key: enum.HealthAnalyzerUiKey.Key
  - type: UserInterface
    interfaces:
      enum.HealthAnalyzerUiKey.Key:
        type: HealthAnalyzerBoundUserInterface
  - type: HealthAnalyzer
    scanningEndSound:
      path: "/Audio/Items/Medical/healthscanner.ogg"
    damageContainers:
    - Mech
  - type: Tag
    tags:
    - DiscreteHealthAnalyzer
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerCellSlotVisuals.Enabled:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  - type: GuideHelp
    guides:
    - Robotics

- type: entity
  id: HandheldMechAnalyzer
  parent:
  - BaseHandheldMechAnalyzer
  - BaseHandheldComputer
  suffix: HandHeld, Powered

- type: entity
  id: HandheldMechAnalyzerEmpty
  parent: HandheldMechAnalyzer
  suffix: HandHeld, Empty
  components:
  - type: Sprite
    sprite: Objects/Specific/Mech/mecha_equipment.rsi
    state: mecha_analyzer
    layers:
    - state: mecha_analyzer
    - state: mecha_analyzer_anim
      shader: unshaded
      visible: false
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default

- type: entity
  id: HandheldMechAnalyzerUnpowered
  parent: BaseHandheldMechAnalyzer
  suffix: Handheld, Unpowered


# Ghost radio
 
- type: entity
  id: ADTGhostRadioUnpowered
  parent: BaseItem
  name: сломанное радио
  description: Просто помехи...
  components:
  - type: Sprite
    sprite: /Textures/Objects/Devices/communication.rsi
    state: old-radio
  - type: Appearance
  - type: GhostRadio
    enabled: false
  - type: ToggleableLightVisuals
    spriteLayer: radio
  - type: ItemToggle
 
- type: entity
  id: ADTGhostRadio
  parent: [ ADTGhostRadioUnpowered, PowerCellSlotMediumItem ]
  suffix: Powered
  components:
  - type: PowerCellDraw
    drawRate: 1
 
- type: entity
  id: ADTGhostRadioEmtpy
  parent: [ ADTGhostRadio ]
  suffix: Empty
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
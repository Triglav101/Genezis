# Vulpkanin Tail Wagging
- type: entity
  id: ActionToggleVulpkaninWagging
  name: action-name-toggle-wagging
  description: action-description-toggle-wagging
  components:
    - type: InstantAction
      icon: { sprite: _RMC14/Mobs/Vulpkanin/tail_markings.rsi, state: tail-wag-icon }
      iconOn: { sprite: _RMC14/Mobs/Vulpkanin/tail_markings.rsi, state: tail-wag-icon }
      itemIconStyle: NoItem
      useDelay: 1 # Prevents Emote Spam
      event: !type:ToggleActionEvent

- type: entity
  id: ActionToggleRootable
  name: action-name-toggle-rootable
  description: action-description-toggle-rootable
  components:
  - type: InstantAction
    icon: Interface/Actions/rooting.png
    iconOn: Interface/Actions/rooting.png
    itemIconStyle: NoItem
    useDelay: 1
    event: !type:ToggleActionEvent
